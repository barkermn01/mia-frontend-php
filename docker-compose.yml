version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: deployment-frontend/Dockerfile
    container_name: mia-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/var/www/html
    environment:
      - ENV=development
      - MIA_DEBUG=${MIA_DEBUG}
      - MIA_API_URL=${MIA_API_URL}
      - MIA_SITE_ID=${MIA_SITE_ID}
      - MIA_VERIFY_SSL=${MIA_VERIFY_SSL}
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
    depends_on:
      - memcached
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: mia-memcached-dev
    ports:
      - "11211:11211"
    command: memcached -m 64
    restart: unless-stopped