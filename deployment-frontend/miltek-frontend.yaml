AWSTemplateFormatVersion: '2010-09-09'
Description: 'Mia Frontend - PHP E-commerce Frontend (Uses Existing VPC)'

Parameters:
  ProjectName:
    Type: String
    Default: mia-frontend
    Description: Project name for resource naming
  
  MiaSiteId:
    Type: String
    Description: the Mia Site ID
  
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Environment name
  
  FrontendDomains:
    Type: CommaDelimitedList
    Description: Comma-separated list of domains (e.g., miltek.miaai.me)
  
  SSLCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for HTTPS (must cover all domains - leave empty for HTTP)
  
  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy
  
  WebCpu:
    Type: Number
    Default: 256
    AllowedValues: [256, 512, 1024, 2048, 4096]
    Description: Web service CPU units
  
  WebMemory:
    Type: Number
    Default: 512
    AllowedValues: [512, 1024, 2048, 4096, 8192]
    Description: Web service memory (MB)
  
  MinTasks:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Minimum number of tasks for auto-scaling
  
  MaxTasks:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Maximum number of tasks for auto-scaling
  
  TargetCPUUtilization:
    Type: Number
    Default: 70
    MinValue: 1
    MaxValue: 100
    Description: Target CPU utilization percentage for auto-scaling
  
  TargetRequestCountPerTarget:
    Type: Number
    Default: 1000
    MinValue: 1
    Description: Target number of requests per task for auto-scaling

Conditions:
  HasSSLCertificate: !Not [!Equals [!Ref SSLCertificateArn, '']]

Resources:
  # ==================== SECURITY GROUPS ====================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-alb-sg'
      GroupDescription: Security group for Frontend Application Load Balancer
      VpcId: vpc-0ac87ba62efba8abb
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-ecs-sg'
      GroupDescription: Security group for Frontend ECS tasks
      VpcId: vpc-0ac87ba62efba8abb
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: HTTP from ALB (Web service)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound (for API calls)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP outbound (for API calls)
        - IpProtocol: tcp
          FromPort: 11211
          ToPort: 11211
          CidrIp: 10.0.11.6/32
          Description: Memcached connection
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ecs-sg'

  # ==================== IAM ROLES ====================

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CatalogueS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub 'arn:aws:s3:::${CatalogueBucket}/*'

  ScraperTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScraperS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${CatalogueBucket}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:PutObjectTagging
                  - s3:DeleteObjectTagging
                Resource: 'arn:aws:s3:::mia-backend-imagesbucket-*/*'

  ScheduledTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunECSTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ScraperTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ECSTaskExecutionRole.Arn
                  - !GetAtt ScraperTaskRole.Arn

  # ==================== APPLICATION LOAD BALANCER ====================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - subnet-075e96bd2e334434a
        - subnet-0e3c5567d9670c7ea
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !If [HasSSLCertificate, 443, 80]
      Protocol: !If [HasSSLCertificate, HTTPS, HTTP]
      Certificates:
        - !If
          - HasSSLCertificate
          - CertificateArn: !Ref SSLCertificateArn
          - !Ref AWS::NoValue

  HTTPRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasSSLCertificate
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # ==================== ECS CLUSTER ====================

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'

  # ==================== ECS SERVICES ====================

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-web-tg'
      Port: 3000
      Protocol: HTTP
      VpcId: vpc-0ac87ba62efba8abb
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckPort: 3000
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-web'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref WebCpu
      Memory: !Ref WebMemory
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      TaskRoleArn: !Ref ECSTaskRole
      ContainerDefinitions:
        - Name: web
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-web:${ImageTag}'
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: ENV
              Value: !Ref Environment
            - Name: MIA_SITE_ID
              Value: !Ref MiaSiteId
            - Name: PORT
              Value: '3000'
            - Name: LOG_LEVEL
              Value: 'info'
            - Name: MEMCACHED_HOST
              Value: '10.0.11.6'
            - Name: MEMCACHED_PORT
              Value: '11211'
            - Name: CATALOGUE_S3_BUCKET
              Value: !Ref CatalogueBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-web'
      RetentionInDays: 7
      KmsKeyId: !Ref AWS::NoValue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  WebService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub '${ProjectName}-web'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !Ref MinTasks
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - subnet-07f1e36ca44257169
            - subnet-025bd73f1d36142e6
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref WebTargetGroup

  # ==================== AUTO SCALING ====================

  WebServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub 'service/${ECSCluster}/${WebService.Name}'
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  WebServiceCPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-web-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref WebServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref TargetCPUUtilization
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  WebServiceRequestCountScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-web-request-count-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref WebServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref TargetRequestCountPerTarget
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub 
            - '${ALBFullName}/${TargetGroupFullName}'
            - ALBFullName: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
              TargetGroupFullName: !GetAtt WebTargetGroup.TargetGroupFullName
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ==================== CATALOGUE S3 BUCKET ====================

  CatalogueBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-catalogue-sync'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  CatalogueBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CatalogueBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForFrontend
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${CatalogueBucket}/*'

  # ==================== SCRAPER ====================

  ScraperTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-scraper'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: 512
      Memory: 1024
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      TaskRoleArn: !Ref ScraperTaskRole
      ContainerDefinitions:
        - Name: scraper
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-scraper:${ImageTag}'
          Environment:
            - Name: CATALOGUE_S3_BUCKET
              Value: !Ref CatalogueBucket
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ScraperLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-scraper'
      RetentionInDays: 14
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ==================== SCHEDULED TASKS ====================

  DailyStockUpdateRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-daily-stock-update'
      Description: Stock and price update from Milltek every 6 hours
      ScheduleExpression: 'rate(6 hours)'
      State: ENABLED
      Targets:
        - Id: StockUpdateTask
          Arn: !GetAtt ECSCluster.Arn
          RoleArn: !GetAtt ScheduledTaskRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref ScraperTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                SecurityGroups:
                  - !Ref ECSSecurityGroup
                Subnets:
                  - subnet-07f1e36ca44257169
                AssignPublicIp: ENABLED
          Input: '{"containerOverrides":[{"name":"scraper","command":["node","ecs-entrypoint.js","--stock-only"]}]}'

  WeeklyFullSyncRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-weekly-full-sync'
      Description: Weekly full scrape and sync from Milltek
      ScheduleExpression: 'cron(0 2 ? * SUN *)'
      State: ENABLED
      Targets:
        - Id: FullSyncTask
          Arn: !GetAtt ECSCluster.Arn
          RoleArn: !GetAtt ScheduledTaskRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref ScraperTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                SecurityGroups:
                  - !Ref ECSSecurityGroup
                Subnets:
                  - subnet-07f1e36ca44257169
                AssignPublicIp: ENABLED
          Input: '{"containerOverrides":[{"name":"scraper","command":["node","ecs-entrypoint.js","--full-sync"]}]}'

Outputs:
  ALBDNSName:
    Description: Frontend Application Load Balancer DNS name - Point your Cloudflare DNS to this
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  FrontendDomains:
    Description: All supported domains for this deployment
    Value: !Join [', ', !Ref FrontendDomains]

  ECSClusterName:
    Description: ECS Cluster name
    Value: !Ref ECSCluster

  WebRepositoryURI:
    Description: Web ECR repository URI
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-web'

  ECRLoginCommand:
    Description: Command to login to ECR
    Value: !Sub 'aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'

  CloudflareSetup:
    Description: Cloudflare DNS setup instructions
    Value: !Sub 
      - 'Create A/CNAME records in Cloudflare pointing ${Domains} to ${ALB}'
      - Domains: !Join [', ', !Ref FrontendDomains]
        ALB: !GetAtt ApplicationLoadBalancer.DNSName

  CatalogueBucketName:
    Description: S3 bucket for catalogue sync
    Value: !Ref CatalogueBucket

  ScraperRepositoryURI:
    Description: Scraper ECR repository URI
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-scraper'